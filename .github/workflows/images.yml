# Flags PNGs and JPEGs on a pull request that could be much smaller at about the same quality.
# Warnings only: it annotates the line that names the image and never fails the check or
# changes an image. See README, "Heavy images".
name: Images

on:
  pull_request:

permissions:
  contents: read

jobs:
  heavy-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Measuring every image takes minutes; results are cached by image content.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/slimdeer
            */node_modules/.cache/slimdeer
          key: slimdeer-${{ github.run_id }}
          restore-keys: slimdeer-
      - run: npx oxlint --format github
